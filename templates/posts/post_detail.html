{% extends "base.html" %}

{% block title %}{{ post.titulo }}{% endblock %}

{% block content %}
<h1>{{ post.titulo }}</h1>
<p class="text-muted">Por {{ post.autor.username }} el {{ post.fecha_creacion|date:"d/m/Y" }}</p>
{% if post.imagen %}
    <img src="{{ post.imagen.url }}" class="img-fluid mb-3" alt="{{ post.titulo }}">
{% endif %}
<div>{{ post.contenido|linebreaks }}</div>
<a href="{% url 'posts:lista' %}" class="btn btn-secondary">Volver</a>
{% endblock %}
